<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أكاديمية التميز - منشئ الواجبات والأسئلة</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .main-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .ai-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #311b92 100%);
            border: 1px solid #6366f1;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .type-badge-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .type-badge-input input {
            width: 60px;
            text-align: center;
            background: #0f172a;
            border: 1px solid #6366f1;
            color: #fff;
            border-radius: 6px;
        }
        .q-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h3 class="text-warning text-center mb-4"><i class="fa-solid fa-graduation-cap ms-2"></i>منشئ الواجبات والأسئلة - أكاديمية التميز</h3>
    
    <div class="mb-3">
        <label class="form-label text-light">عنوان الواجب / الاختبار:</label>
        <input type="text" id="assignmentTitle" class="form-control bg-dark text-white border-secondary" placeholder="أدخل عنوان الواجب...">
    </div>

    <!-- قسم الذكاء الاصطناعي لاستخراج واستيراد الأسئلة -->
    <div class="ai-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-white m-0"><i class="fa-solid fa-robot text-info ms-2"></i>إنشاء أسئلة بالذكاء الاصطناعي (Gemini)</h5>
            <button class="btn btn-sm btn-outline-info" onclick="triggerPdfUpload()"><i class="fa-solid fa-file-pdf me-1"></i>استيراد من PDF</button>
            <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;" onchange="handlePdfUpload(event)">
        </div>

        <div class="mb-3">
            <label class="form-label text-light">البرومبت / وصف موضوع الأسئلة أو النص المستخرج:</label>
            <textarea id="aiPrompt" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="مثال: قم بعمل أسئلة عن إعراب المبتدأ والخبر، أو قم برفع ملف PDF لاستخراج النص هنا تلقائياً..."></textarea>
        </div>

        <label class="form-label text-light fw-bold mb-2">تحديد عدد الأسئلة المطلوب توليدها من كل نوع:</label>
        <div class="row g-2 mb-3">
            <div class="col-md-4 col-6">
                <div class="type-badge-input">
                    <span><i class="fa-regular fa-circle-dot text-primary ms-1"></i>اختيار متعدد:</span>
                    <input type="number" id="count_mcq" value="2" min="0">
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="type-badge-input">
                    <span><i class="fa-solid fa-square-check text-success ms-1"></i>صح أم خطأ:</span>
                    <input type="number" id="count_tf" value="2" min="0">
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="type-badge-input">
                    <span><i class="fa-solid fa-pen text-warning ms-1"></i>أكمل الفراغ:</span>
                    <input type="number" id="count_fill" value="2" min="0">
                </div>
            </div>
            <div class="col-md-6 col-6">
                <div class="type-badge-input">
                    <span><i class="fa-solid fa-file-lines text-info ms-1"></i>سؤال مقالي:</span>
                    <input type="number" id="count_essay" value="1" min="0">
                </div>
            </div>
            <div class="col-md-6 col-12">
                <div class="type-badge-input">
                    <span><i class="fa-solid fa-link text-danger ms-1"></i>توصيل / مزاوجة:</span>
                    <input type="number" id="count_match" value="1" min="0">
                </div>
            </div>
        </div>

        <button id="btnGenerate" class="btn btn-primary w-100 fw-bold" onclick="generateQuestionsAI()">
            <i class="fa-solid fa-wand-magic-sparkles me-2"></i>توليد وإضافة الأسئلة للواجب فوراً
        </button>
    </div>

    <!-- قائمة الأسئلة الناتجة -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-light m-0">الأسئلة المُنشأة (<span id="qCount">0</span>):</h5>
        <button class="btn btn-sm btn-danger" onclick="clearQuestions()"><i class="fa-solid fa-trash me-1"></i>مسح الكل</button>
    </div>

    <div id="questionsContainer"></div>

    <button class="btn btn-success w-100 mt-4 py-2 fw-bold" onclick="saveAssignment()"><i class="fa-solid fa-floppy-disk me-2"></i>حفظ ونشر الواجب</button>
</div>

<script>
    let generatedQuestions = [];

    function triggerPdfUpload() {
        document.getElementById('pdfFileInput').click();
    }

    async function handlePdfUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const promptBox = document.getElementById('aiPrompt');
        promptBox.value = 'جاري استخراج النص من ملف الـ PDF... برجاء الانتظار';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
            }

            if (!fullText.trim()) {
                alert('لم نتمكن من قراءة نص من هذا الملف (قد يكون صورة مسحوبة). يمكنك نسخ النص يدوياً ولصقه.');
                promptBox.value = '';
            } else {
                promptBox.value = fullText.trim();
            }
        } catch (err) {
            alert('حدث خطأ أثناء قراءة ملف الـ PDF: ' + err.message);
            promptBox.value = '';
        }
    }

    async function generateQuestionsAI() {
        const prompt = document.getElementById('aiPrompt').value.trim();
        if (!prompt) {
            alert('يرجى كتابة برومبت أو رفع ملف PDF أولاً!');
            return;
        }

        const counts = {
            mcq: parseInt(document.getElementById('count_mcq').value) || 0,
            tf: parseInt(document.getElementById('count_tf').value) || 0,
            fill: parseInt(document.getElementById('count_fill').value) || 0,
            essay: parseInt(document.getElementById('count_essay').value) || 0,
            match: parseInt(document.getElementById('count_match').value) || 0
        };

        const btn = document.getElementById('btnGenerate');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>جاري التوليد بواسطة Gemini...';

        try {
            const res = await fetch('/.netlify/functions/generate-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, counts })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'فشل الاتصال بالخادم');

            if (data.questions && Array.isArray(data.questions)) {
                generatedQuestions = [...generatedQuestions, ...data.questions];
                renderQuestions();
            } else {
                alert('لم يتم استرجاع أسئلة بالصيغة الصحيحة');
            }
        } catch (err) {
            alert('خطأ في الاتصال بالخادم أو مفتاح API: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles me-2"></i>توليد وإضافة الأسئلة للواجب فوراً';
        }
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        document.getElementById('qCount').innerText = generatedQuestions.length;
        container.innerHTML = '';

        generatedQuestions.forEach((q, idx) => {
            let html = `<div class="q-card">`;
            html += `<div class="d-flex justify-content-between"><strong class="text-warning">سؤال ${idx + 1} (${getTypeName(q.type)}):</strong>`;
            html += `<button class="btn btn-sm btn-outline-danger" onclick="removeQuestion(${idx})"><i class="fa-solid fa-xmark"></i></button></div>`;
            html += `<p class="mt-2 mb-2 text-white">${q.question}</p>`;

            if (q.type === 'mcq' && q.options) {
                html += `<ul class="mb-1 text-light">` + q.options.map((opt, i) => `<li class="${i === q.answer ? 'text-success fw-bold' : ''}">${opt} ${i === q.answer ? '✓' : ''}</li>`).join('') + `</ul>`;
            } else if (q.type === 'tf') {
                html += `<div class="text-info">الإجابة الصحيحة: <strong>${q.answer ? 'صح' : 'خطأ'}</strong></div>`;
            } else if (q.type === 'fill' || q.type === 'essay') {
                html += `<div class="text-info">الإجابة النموذجية: <strong>${q.answer}</strong></div>`;
            } else if (q.type === 'match' && q.pairs) {
                html += `<ul class="text-light">` + q.pairs.map(p => `<li>${p.left} ⬅️ ${p.right}</li>`).join('') + `</ul>`;
            }

            html += `</div>`;
            container.innerHTML += html;
        });
    }

    function getTypeName(type) {
        switch(type) {
            case 'mcq': return 'اختيار من متعدد';
            case 'tf': return 'صح أم خطأ';
            case 'fill': return 'أكمل الفراغ';
            case 'essay': return 'مقالي';
            case 'match': return 'توصيل';
            default: return 'سؤال';
        }
    }

    function removeQuestion(index) {
        generatedQuestions.slice(index, 1); // fixed
        generatedQuestions.splice(index, 1);
        renderQuestions();
    }

    function clearQuestions() {
        generatedQuestions = [];
        renderQuestions();
    }

    function saveAssignment() {
        if (generatedQuestions.length === 0) {
            alert('قم بتوليد أو إضافة أسئلة أولاً!');
            return;
        }
        alert('تم حفظ الواجب بنجاح!');
    }
</script>
</body>
</html>
