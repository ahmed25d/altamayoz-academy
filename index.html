        const defaultTeachers = [

            { id: 'ann-2', title: '⭐ مسابقة التفوق العلمي لأكاديمية التميز', content: 'نلفت عناية طلابنا الأعزاء إلى انطلاق مسابقة التميز العلمية يوم الخميس القادم.', attachmentName: '', date: '2026-10-25', startDate: '2026-10-25T08:00', endDate: '2026-11-05T23:59' }

        const defaultAssignments = [
            {

                titleAr: 'الرفع في الأسماء و الافعال',

                endDate: '2026-11-02T23:59',
                questions: [
                    { id: 'q-1', type: 'MCQ', textAr: 'الفعل المضارع يرفع إذا لم يسبقه:', optionsAr: ['ناصب أو جازم', 'حرف جر', 'حرف عطف', 'لا شيء'], correctOptionIndex: 0 },
                    { id: 'q-2', type: 'TF', textAr: 'المبتدأ والخبر مرفوعان دائماً.', trueFalseAnswer: true }
                ]
            }
        ];

        const lettersList = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح'];

        function App() {
            const [lang, setLang] = useState('ar');
            const [role, setRole] = useState('Teacher'); 
            const [activeTab, setActiveTab] = useState('assignments');

            const [subjects, setSubjects] = useState(() => JSON.parse(localStorage.getItem('altamayoz_subjects')) || defaultSubjects);
            const [teachersList, setTeachersList] = useState(() => JSON.parse(localStorage.getItem('altamayoz_teachers')) || defaultTeachers);
            const [studentsList, setStudentsList] = useState(() => JSON.parse(localStorage.getItem('altamayoz_students')) || defaultStudents);
            const [announcements, setAnnouncements] = useState(() => JSON.parse(localStorage.getItem('altamayoz_announcements')) || defaultAnnouncements);
            const [assignments, setAssignments] = useState(() => JSON.parse(localStorage.getItem('altamayoz_assignments')) || defaultAssignments);

            useEffect(() => { localStorage.setItem('altamayoz_subjects', JSON.stringify(subjects)); }, [subjects]);
            useEffect(() => { localStorage.setItem('altamayoz_teachers', JSON.stringify(teachersList)); }, [teachersList]);
            useEffect(() => { localStorage.setItem('altamayoz_students', JSON.stringify(studentsList)); }, [studentsList]);
            useEffect(() => { localStorage.setItem('altamayoz_assignments', JSON.stringify(assignments)); }, [assignments]);
            useEffect(() => { localStorage.setItem('altamayoz_announcements', JSON.stringify(announcements)); }, [announcements]);

            const [currentBannerIndex, setCurrentBannerIndex] = useState(0);

            useEffect(() => {
                if (announcements.length === 0) return;
                const timer = setInterval(() => {
                    setCurrentBannerIndex(prev => (prev + 1) % announcements.length);
                }, 6000);
                return () => clearInterval(timer);
            }, [announcements]);

            const [showAddSubjectModal, setShowAddSubjectModal] = useState(false);
            const [showAddStudentModal, setShowAddStudentModal] = useState(false);
            const [showAddTeacherModal, setShowAddTeacherModal] = useState(false);
            const [showAddAnnouncementModal, setShowAddAnnouncementModal] = useState(false);
            const [showBuilderModal, setShowBuilderModal] = useState(false);

            const [activeStudentAssignment, setActiveStudentAssignment] = useState(null);
            const [studentAnswers, setStudentAnswers] = useState({});

            const [newTeacherForm, setNewTeacherForm] = useState({ name: '', subject: 'الدراسات الاجتماعية', grades: ['خامس ابتدائي'], username: '', password: '123' });
            const [newStudentForm, setNewStudentForm] = useState({ name: '', grade: 'سادس ابتدائي', username: '', password: '', subject: 'الرياضيات', teacher: 'أ. محمد خالد', participation: 10, assignments: 20, behavior: 10, termExam: 50 });
            const [newSubjectForm, setNewSubjectForm] = useState({ nameAr: '', code: '' });
            
            const [editingAnnouncementId, setEditingAnnouncementId] = useState(null);
            const [newAnnouncement, setNewAnnouncement] = useState({ title: '', content: '', startDate: '2026-10-26T08:00', endDate: '2026-11-02T23:59', file: null, existingAttachmentName: '' });

            const [editingAssignmentId, setEditingAssignmentId] = useState(null);
            const [newAssignmentForm, setNewAssignmentForm] = useState({ titleAr: '', startDate: '2026-10-26T08:00', endDate: '2026-11-02T23:59', questions: [] });

            const [editingQuestionIndex, setEditingQuestionIndex] = useState(null);

            const [showAiGenerator, setShowAiGenerator] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiQuestionCounts, setAiQuestionCounts] = useState({ MCQ: 2, TF: 1, SHORT: 0, ESSAY: 0, MATCHING: 0 });
            const [isAiGenerating, setIsAiGenerating] = useState(false);

            // Import States
            const [showImportModal, setShowImportModal] = useState(false);
            const [importText, setImportText] = useState('');
            const [importFile, setImportFile] = useState(null);
            const [isImporting, setIsImporting] = useState(false);
            const [extractedImportQuestions, setExtractedImportQuestions] = useState([]);
            const [importReviewMode, setImportReviewMode] = useState(false);

            const [currentEditingQuestion, setCurrentEditingQuestion] = useState({
                type: 'MCQ', textAr: '', optionsAr: ['', '', '', ''], correctOptionIndex: 0, trueFalseAnswer: true, shortAnswerModel: '', essayGuideModel: '',
                matchingPairs: [{ id: 1, numberLabel: '1', rightText: '', leftLetter: 'أ', leftText: '', correctAnswerLetter: 'أ' }]
            });

            const [notification, setNotification] = useState(null);
            const t = translations[lang];
            const isRTL = lang === 'ar';

            const triggerNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 4000);
            };

            const handleGradeChange = (id, field, value) => {
                setStudentsList(prev => prev.map(st => st.id === id ? { ...st, [field]: Number(value) } : st));
            };

            const handleAddTeacher = () => {
                if (!newTeacherForm.name) return;
                const created = { id: 't-' + Date.now(), name: newTeacherForm.name, subject: newTeacherForm.subject, grades: newTeacherForm.grades, username: newTeacherForm.username || 'teacher_' + Math.floor(Math.random()*1000), password: newTeacherForm.password || '123' };
                setTeachersList(prev => [...prev, created]);
                setShowAddTeacherModal(false);
                setNewTeacherForm({ name: '', subject: 'الدراسات الاجتماعية', grades: ['خامس ابتدائي'], username: '', password: '123' });
                triggerNotification(lang === 'ar' ? 'تمت إضافة المعلم بنجاح!' : 'Teacher added successfully!');
            };

            const handleRemoveTeacher = (id) => {
                setTeachersList(prev => prev.filter(t => t.id !== id));
                triggerNotification(lang === 'ar' ? 'تم حذف المعلم!' : 'Teacher removed!');
            };

            const handleAddStudentByAdmin = () => {
                if (!newStudentForm.name) return;
                const created = { id: 'st-' + Date.now(), name: newStudentForm.name, grade: newStudentForm.grade, username: newStudentForm.username || 'student_' + Math.floor(Math.random()*1000), password: newStudentForm.password || '123', subject: newStudentForm.subject || 'الرياضيات', teacher: newStudentForm.teacher || 'أ. محمد خالد', participation: Number(newStudentForm.participation), assignments: Number(newStudentForm.assignments), behavior: Number(newStudentForm.behavior), termExam: Number(newStudentForm.termExam) };
                setStudentsList(prev => [...prev, created]);
                setShowAddStudentModal(false);
                setNewStudentForm({ name: '', grade: 'سادس ابتدائي', username: '', password: '', subject: 'الرياضيات', teacher: 'أ. محمد خالد', participation: 10, assignments: 20, behavior: 10, termExam: 50 });
                triggerNotification(lang === 'ar' ? 'تمت إضافة الطالب بنجاح!' : 'Student added successfully!');
            };

            const handleRemoveStudent = (id) => {
                setStudentsList(prev => prev.filter(s => s.id !== id));
                triggerNotification(lang === 'ar' ? 'تم حذف الطالب!' : 'Student removed!');
            };

            const handleAddSubjectByAdmin = () => {
                if (!newSubjectForm.nameAr || !newSubjectForm.code) return alert('يرجى إدخال اسم المادة والرمز');
                const gradients = ['from-purple-600 via-indigo-600 to-pink-500', 'from-emerald-600 via-teal-600 to-cyan-500'];
                const badges = ['bg-purple-500/20 text-purple-300 border-purple-500/30', 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'];
                const randomIndex = Math.floor(Math.random() * gradients.length);
                const newSubObj = { id: 'sub-' + Date.now(), nameAr: newSubjectForm.nameAr, nameEn: newSubjectForm.nameAr, code: newSubjectForm.code.toUpperCase(), color: gradients[randomIndex], badgeColor: badges[randomIndex] };
                setSubjects([...subjects, newSubObj]);
                setShowAddSubjectModal(false);
                setNewSubjectForm({ nameAr: '', code: '' });
                triggerNotification(lang === 'ar' ? 'تمت إضافة المادة بنجاح!' : 'Subject added successfully!');
            };

            const handleRemoveSubject = (id) => {
                setSubjects(subjects.filter(s => s.id !== id));
                triggerNotification(lang === 'ar' ? 'تم حذف المادة بنجاح!' : 'Subject removed!');
            };

            const handleSaveAnnouncement = () => {
                if (!newAnnouncement.title || !newAnnouncement.content) return alert('يرجى كتابة عنوان وتفاصيل الإعلان');
                const attachment = newAnnouncement.file ? newAnnouncement.file.name : (newAnnouncement.existingAttachmentName || '');
                if (editingAnnouncementId) {
                    setAnnouncements(announcements.map(ann => ann.id === editingAnnouncementId ? { ...ann, title: newAnnouncement.title, content: newAnnouncement.content, startDate: newAnnouncement.startDate, endDate: newAnnouncement.endDate, attachmentName: attachment } : ann));
                    triggerNotification(lang === 'ar' ? 'تم تعديل الإعلان بنجاح!' : 'Announcement updated successfully!');
                } else {
                    const created = { id: 'ann-' + Date.now(), title: newAnnouncement.title, content: newAnnouncement.content, startDate: newAnnouncement.startDate, endDate: newAnnouncement.endDate, attachmentName: attachment, date: new Date().toISOString().split('T')[0] };
                    setAnnouncements([created, ...announcements]);
                    triggerNotification(lang === 'ar' ? 'تم نشر الإعلان بنجاح!' : 'Announcement published!');
                }
                setShowAddAnnouncementModal(false);
                setEditingAnnouncementId(null);
                setNewAnnouncement({ title: '', content: '', startDate: '2026-10-26T08:00', endDate: '2026-11-02T23:59', file: null, existingAttachmentName: '' });
            };

            const handleEditAnnouncement = (ann) => {
                setEditingAnnouncementId(ann.id);
                setNewAnnouncement({ title: ann.title || '', content: ann.content || '', startDate: ann.startDate || '2026-10-26T08:00', endDate: ann.endDate || '2026-11-02T23:59', file: null, existingAttachmentName: ann.attachmentName || '' });
                setShowAddAnnouncementModal(true);
            };

            const handleDeleteAnnouncement = (id) => {
                if (confirm(lang === 'ar' ? 'هل أنت تأكد من حذف هذا الإعلان؟' : 'Are you sure?')) {
                    setAnnouncements(announcements.filter(ann => ann.id !== id));
                    triggerNotification(lang === 'ar' ? 'تم حذف الإعلان بنجاح!' : 'Announcement deleted successfully!');
                }
            };

            const handleAddMatchingPair = () => {
                const count = currentEditingQuestion.matchingPairs.length;
                if (count >= 8) return;
                const newLetter = lettersList[count] || 'أ';
                const newPair = { id: Date.now(), numberLabel: `${count + 1}`, rightText: '', leftLetter: newLetter, leftText: '', correctAnswerLetter: newLetter };
                setCurrentEditingQuestion({ ...currentEditingQuestion, matchingPairs: [...currentEditingQuestion.matchingPairs, newPair] });
            };

            const handleRemoveMatchingPair = (index) => {
                if (currentEditingQuestion.matchingPairs.length <= 1) return;
                const updated = currentEditingQuestion.matchingPairs.filter((_, i) => i !== index);
                const reindexed = updated.map((pair, idx) => ({ ...pair, numberLabel: `${idx + 1}`, leftLetter: lettersList[idx] || 'أ' }));
                setCurrentEditingQuestion({ ...currentEditingQuestion, matchingPairs: reindexed });
            };

            const handleAddOrUpdateQuestionInAssignment = () => {
                if (!currentEditingQuestion.textAr) return alert('يرجى كتابة نص السؤال أولاً');
                let updatedQuestions = [...newAssignmentForm.questions];
                if (editingQuestionIndex !== null) {
                    updatedQuestions[editingQuestionIndex] = { ...currentEditingQuestion, id: updatedQuestions[editingQuestionIndex].id || ('q-' + Date.now()) };
                    setEditingQuestionIndex(null);
                    triggerNotification(lang === 'ar' ? 'تم تعديل السؤال بنجاح!' : 'Question updated!');
                } else {
                    updatedQuestions.push({ ...currentEditingQuestion, id: 'q-' + Date.now() });
                    triggerNotification(lang === 'ar' ? 'تم إضافة السؤال بنجاح!' : 'Question added!');
                }
                setNewAssignmentForm({ ...newAssignmentForm, questions: updatedQuestions });
                setCurrentEditingQuestion({ type: 'MCQ', textAr: '', optionsAr: ['', '', '', ''], correctOptionIndex: 0, trueFalseAnswer: true, shortAnswerModel: '', essayGuideModel: '', matchingPairs: [{ id: 1, numberLabel: '1', rightText: '', leftLetter: 'أ', leftText: '', correctAnswerLetter: 'أ' }] });
            };

            const handleEditExistingQuestion = (index) => {
                const qToEdit = newAssignmentForm.questions[index];
                setCurrentEditingQuestion({
                    type: qToEdit.type || 'MCQ', textAr: qToEdit.textAr || '', optionsAr: qToEdit.optionsAr ? [...qToEdit.optionsAr] : ['', '', '', ''],
                    correctOptionIndex: qToEdit.correctOptionIndex !== undefined ? qToEdit.correctOptionIndex : 0, trueFalseAnswer: qToEdit.trueFalseAnswer !== undefined ? qToEdit.trueFalseAnswer : true,
                    shortAnswerModel: qToEdit.shortAnswerModel || '', essayGuideModel: qToEdit.essayGuideModel || '', matchingPairs: qToEdit.matchingPairs ? [...qToEdit.matchingPairs] : [{ id: 1, numberLabel: '1', rightText: '', leftLetter: 'أ', leftText: '', correctAnswerLetter: 'أ' }]
                });
                setEditingQuestionIndex(index);
            };

            const handleRemoveQuestionFromAssignment = (index) => {
                const updatedQuestions = newAssignmentForm.questions.filter((_, i) => i !== index);
                setNewAssignmentForm({ ...newAssignmentForm, questions: updatedQuestions });
                if (editingQuestionIndex === index) setEditingQuestionIndex(null);
                triggerNotification(lang === 'ar' ? 'تم حذف السؤال!' : 'Question removed!');
            };

            const handleGenerateAiQuestions = async () => {
                if (!aiPrompt) return alert('يرجى كتابة وصف المفهوم أو البرومبت أولاً');
                setIsAiGenerating(true);
                try {
                    const response = await fetch('/.netlify/functions/generate-questions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: aiPrompt, counts: aiQuestionCounts })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Failed to generate');
                    setNewAssignmentForm(prev => ({ ...prev, questions: [...prev.questions, ...data.questions] }));
                    triggerNotification(lang === 'ar' ? `✨ تم توليد الأسئلة بنجاح!` : `Successfully generated questions!`);
                    setShowAiGenerator(false);
                    setAiPrompt('');
                } catch (err) {
                    console.error('AI Error:', err);
                    alert('خطأ في الاتصال بالخادم أو مفتاح API: ' + err.message);
                } finally {
                    setIsAiGenerating(false);
                }
            };

            // TRUE PDF TEXT EXTRACTION VIA PDF.JS & SECURE NETLIFY FUNCTION
            const handleProcessImportDocument = async () => {
                if (!importText.trim() && !importFile) {
                    return alert(lang === 'ar' ? 'يرجى لصق نص الأسئلة أو رفع ملف PDF أولاً.' : 'Please paste text or upload a PDF first.');
                }
                setIsImporting(true);
                try {
                    let fullExtractedText = importText;

                    if (importFile) {
                        if (importFile.type === 'application/pdf' || importFile.name.toLowerCase().endsWith('.pdf')) {
                            const arrayBuffer = await importFile.arrayBuffer();
                            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                            const pdfDoc = await loadingTask.promise;
                            let pagesText = [];
                            for (let i = 1; i <= pdfDoc.numPages; i++) {
                                const page = await pdfDoc.getPage(i);
                                const textContent = await page.getTextContent();
                                const pageStr = textContent.items.map(item => item.str).join(' ');
                                pagesText.push(pageStr);
                            }
                            fullExtractedText += '\n\n' + pagesText.join('\n');
                        } else {
                            // Text file reader fallback
                            const readerText = await new Promise((resolve) => {
                                const r = new FileReader();
                                r.onload = (e) => resolve(e.target.result);
                                r.onerror = () => resolve('');
                                r.readAsText(importFile, 'UTF-8');
                            });
                            fullExtractedText += '\n\n' + readerText;
                        }
                    }

                    // Call secure Netlify serverless function to parse questions cleanly
                    const response = await fetch('/.netlify/functions/generate-questions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rawText: fullExtractedText })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Failed to parse document text');

                    const formattedExtracted = (data.questions || []).map((q, idx) => ({
                        ...q,
                        id: 'q-import-' + Date.now() + '-' + idx,
                        selected: true,
                        textAr: q.textAr || 'سؤال مستورد',
                        type: q.type || 'MCQ',
                        optionsAr: q.optionsAr || ['خيار 1', 'خيار 2', 'خيار 3', 'خيار 4'],
                        correctOptionIndex: q.correctOptionIndex !== undefined ? q.correctOptionIndex : 0,
                        trueFalseAnswer: q.trueFalseAnswer !== undefined ? q.trueFalseAnswer : true
                    }));

                    setExtractedImportQuestions(formattedExtracted);
                    setImportReviewMode(true);
                    triggerNotification(lang === 'ar' ? `📥 تم استخراج ${formattedExtracted.length} سؤالاً بنجاح!` : `Extracted ${formattedExtracted.length} questions!`);
                } catch (err) {
                    console.error('Import Error:', err);
                    alert('حدث خطأ أثناء معالجة وقراءة المستند: ' + err.message);
                } finally {
                    setIsImporting(false);
                }
            };

            const handleImportApprovedQuestions = () => {
                const approved = extractedImportQuestions.filter(q => q.selected);
                if (approved.length === 0) return alert('يرجى تحديد سؤال واحد على الأقل.');
                const cleaned = approved.map(({ selected, ...rest }) => ({ ...rest, id: 'q-imported-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5) }));
                setNewAssignmentForm(prev => ({ ...prev, questions: [...prev.questions, ...cleaned] }));
                triggerNotification(lang === 'ar' ? `✨ تم استيراد ${cleaned.length} سؤالاً بنجاح!` : `Successfully imported ${cleaned.length} questions!`);
                setShowImportModal(false);
                setImportReviewMode(false);
                setImportText('');
                setImportFile(null);
                setExtractedImportQuestions([]);
            };

            const handleSaveAssignment = () => {
                if (!newAssignmentForm.titleAr) return alert('يرجى كتابة عنوان الواجب أولاً');
                if (editingAssignmentId) {
                    setAssignments(assignments.map(asg => asg.id === editingAssignmentId ? { ...asg, ...newAssignmentForm } : asg));
                    triggerNotification(lang === 'ar' ? 'تم تعديل الواجب بنجاح!' : 'Assignment updated!');
                } else {
                    setAssignments([{ id: 'asg-' + Date.now(), ...newAssignmentForm }, ...assignments]);
                    triggerNotification(lang === 'ar' ? 'تم نشر الواجب بنجاح!' : 'Assignment published!');
                }
                setShowBuilderModal(false);
                setEditingAssignmentId(null);
                setEditingQuestionIndex(null);
                setNewAssignmentForm({ titleAr: '', startDate: '2026-10-26T08:00', endDate: '2026-11-02T23:59', questions: [] });
            };

            const handleEditAssignment = (asg) => {
                setEditingAssignmentId(asg.id);
                setEditingQuestionIndex(null);

                setStudentAnswers({});

            const handleSubmitStudentAssignment = () => {

                setStudentAnswers({});

                    <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-blue-900/50 shadow-xl">

                            <div className="flex items-center justify-between w-full sm:w-auto">
                                <div className="flex items-center gap-2.5">
                                    <div className="bg-gradient-to-tr from-red-600 via-yellow-500 to-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/20">🎓</div>
                                    <div>
                                        <h1 className="text-lg sm:text-2xl font-black text-yellow-400 leading-tight">{t.appName}</h1>
                                        <p className="text-[10px] sm:text-xs text-blue-200/90 font-bold">{t.appSubName}</p>
                                    </div>
                                </div>
                                <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="sm:hidden bg-blue-600 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-lg">🌐 {t.langToggle}</button>
                            </div>

                            <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-0 border-slate-800/80 pt-2 sm:pt-0">
                                <select value={role} onChange={(e) => { setRole(e.target.value); if (e.target.value === 'Student' && activeTab === 'adminPanel') setActiveTab('grading'); }} className="bg-slate-800 text-slate-100 border border-blue-500/40 px-2.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer">

                                            {t.addAssignment}

                                <div className="space-y-3">

                                            <div>
                                                <h3 className="text-base font-black text-white">{asg.titleAr} {role === 'Student' && <span className="text-xs text-yellow-400">(اضغط للحل ✍️)</span>}</h3>
                                                <div className="flex gap-3 mt-1 text-[11px] text-yellow-400 font-bold">
                                                    <span>🕒 يبدأ: {asg.startDate}</span><span>📌 الأسئلة: {asg.questions?.length || 0}</span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2" onClick={e => e.stopPropagation()}>
                                                {(role === 'Teacher' || role === 'Admin') && (
                                                    <>
                                                        <button onClick={() => handleEditAssignment(asg)} className="bg-amber-500/20 text-amber-300 p-1.5 rounded-lg text-xs">✏️</button>
                                                        <button onClick={() => handleDeleteAssignment(asg.id)} className="bg-red-600/20 text-red-300 p-1.5 rounded-lg text-xs">✕</button>
                                                    </>
                                                )}
                                                {role === 'Student' && <button onClick={() => handleOpenAssignmentForStudent(asg)} className="bg-yellow-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-black">بدء الحل ✍️</button>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'grading' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-black text-white">{t.navGrading}</h2>
                                <div className="bg-slate-900 rounded-2xl border border-blue-500/30 overflow-x-auto shadow-xl">
                                    <table className="w-full text-right text-xs">
                                        <thead className="bg-slate-950 text-yellow-400 font-black border-b border-slate-800">
                                            <tr>
                                                <th className="p-3.5">{t.studentName}</th><th className="p-3.5">{t.schoolYear}</th><th className="p-3.5">{t.subjectCol}</th><th className="p-3.5">{t.participation}</th><th className="p-3.5">{t.assignmentsCol}</th><th className="p-3.5">{t.behavior}</th><th className="p-3.5">{t.termExam}</th><th className="p-3.5">{t.total}</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/60 font-bold">
                                            {filteredStudents.map((st) => (
                                                <tr key={st.id} className="hover:bg-slate-850">
                                                    <td className="p-3.5 text-white font-black">{st.name}</td>
                                                    <td className="p-3.5 text-blue-300">{st.grade}</td>
                                                    <td className="p-3.5 text-amber-300">{st.subject}</td>
                                                    <td className="p-3.5 text-yellow-400">{st.participation}</td>
                                                    <td className="p-3.5 text-yellow-400">{st.assignments}</td>
                                                    <td className="p-3.5 text-yellow-400">{st.behavior}</td>
                                                    <td className="p-3.5 text-yellow-400">{st.termExam}</td>
                                                    <td className="p-3.5 text-emerald-400 font-black">{st.participation + st.assignments + st.behavior + st.termExam} / 100</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'subjects' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-black text-white">{t.navSubjects}</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

                        {activeTab === 'announcements' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-black text-white">{t.announcementsTitle}</h2>
                                {announcements.map(ann => (
                                    <div key={ann.id} className="bg-slate-900 rounded-2xl p-5 border border-blue-500/30 space-y-2">
                                        <h3 className="text-lg font-black text-white">{ann.title}</h3>
                                        <p className="text-xs text-yellow-100">{ann.content}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Assignment Solver Modal */}
                    {activeStudentAssignment && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-3">

                    {/* Assignment Builder Modal */}
                    {showBuilderModal && (

                                    <div className="space-y-4">
                                        <h4 className="text-xs font-black text-emerald-300">مراجعة الأسئلة المستخرجة ({extractedImportQuestions.length}):</h4>
                                        <div className="space-y-3 max-h-[50vh] overflow-y-auto">
                                            {extractedImportQuestions.map((q, qIndex) => (
                                                <div key={q.id || qIndex} className="bg-slate-950 p-3 rounded-xl border border-emerald-500/30 space-y-2 text-xs">
                                                    <div className="flex justify-between">
                                                        <label className="flex items-center gap-2">
                                                            <input type="checkbox" checked={q.selected} onChange={e => { const u = [...extractedImportQuestions]; u[qIndex].selected = e.target.checked; setExtractedImportQuestions(u); }} />
                                                            <span className="font-black text-emerald-400">سؤال {qIndex + 1} [{q.type}]</span>
                                                        </label>
                                                        <button onClick={() => setExtractedImportQuestions(extractedImportQuestions.filter((_, i) => i !== qIndex))} className="text-red-400">حذف</button>
                                                    </div>
                                                    <input type="text" value={q.textAr} onChange={e => { const u = [...extractedImportQuestions]; u[qIndex].textAr = e.target.value; setExtractedImportQuestions(u); }} className="w-full p-2 bg-slate-900 border border-slate-800 rounded text-white" />
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                                            <button onClick={() => setImportReviewMode(false)} className="px-4 py-2 bg-slate-800 text-xs rounded-xl">السابق</button>
                                            <button onClick={handleImportApprovedQuestions} className="px-5 py-2 bg-emerald-600 text-white text-xs font-black rounded-xl">استيراد الأسئلة المحددة</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
